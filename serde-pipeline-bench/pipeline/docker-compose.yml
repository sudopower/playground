# Local pipeline harness: a single-node Kafka (KRaft) plus a resource-CAPPED
# consumer. The cap is the whole point — every format decodes the same fixed
# backlog under identical CPU/memory, so throughput differences are attributable
# to the codec and nothing else.
#
# Usage (see ../run-pipeline.sh for the full loop):
#   docker compose -f pipeline/docker-compose.yml up -d kafka
#   FORMAT=json docker compose -f pipeline/docker-compose.yml run --rm producer
#   FORMAT=json docker compose -f pipeline/docker-compose.yml run --rm consumer
#
# CONSUMER_CPUS / CONSUMER_MEM override the cap; N overrides the fixed lag.

name: serde-bench

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: serde-bench-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_MS: -1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Producer runs UNCAPPED — it only sets up the fixed backlog; its speed is not
  # under test. It connects on the internal listener.
  producer:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
    image: serde-bench:latest
    entrypoint: ["/producer"]
    command: ["-brokers", "kafka:19092", "-format", "${FORMAT:-json}", "-n", "${N:-2000000}"]
    depends_on:
      kafka:
        condition: service_healthy

  # Consumer is CAPPED. This is the measured stage.
  consumer:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
    image: serde-bench:latest
    entrypoint: ["/consumer"]
    command: ["-brokers", "kafka:19092", "-format", "${FORMAT:-json}", "-n", "${N:-2000000}"]
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${CONSUMER_CPUS:-1.0}"
          memory: "${CONSUMER_MEM:-512M}"
